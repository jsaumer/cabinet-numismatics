version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # pydantic pins pydantic-core exactly, so neither can move alone: one
      # pull request moves both. (Ignoring pydantic-core instead, as 0.34.0
      # did, left every pydantic bump unable to install.)
      pydantic:
        patterns:
          - pydantic
          - pydantic-core

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must be the same version, or the app fails to
      # render; one PR moves them, and their types, together.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
