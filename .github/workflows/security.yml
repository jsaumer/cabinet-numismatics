name: Security

# Known-vulnerability checks: on every change, and weekly, because new
# advisories land against code that hasn't changed. Separate from CI so a
# freshly published CVE in a base image shows up here without blocking a
# release that didn't cause it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Audit the backend lockfile
        # requirements.txt is exactly what the image installs.
        run: |
          pip install --quiet pip-audit
          pip-audit --requirement backend/requirements.txt --disable-pip --strict

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Audit what the frontend ships
        working-directory: frontend
        # Runtime dependencies only: dev tools never reach the image's
        # served files.
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build both images
        run: |
          docker build -t cabinet-backend:scan backend
          docker build -t cabinet-proxy:scan -f frontend/Dockerfile .

      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cabinet-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only what an update would actually fix
          exit-code: "1"

      - name: Scan the proxy image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cabinet-proxy:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
