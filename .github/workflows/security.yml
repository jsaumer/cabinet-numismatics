name: Security

# Known-vulnerability checks: on every change, and weekly, because new
# advisories land against code that hasn't changed. Separate from CI so a
# freshly published CVE in a base image shows up here without blocking a
# release that didn't cause it.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependencies (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Audit the backend lockfile
        # requirements.txt is exactly what the image installs.
        run: |
          pip install --quiet pip-audit
          pip-audit --requirement backend/requirements.txt --disable-pip --strict

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Audit what the frontend ships
        working-directory: frontend
        # Runtime dependencies only: dev tools never reach the image's
        # served files.
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build both images
        run: |
          docker build -t cabinet-backend:scan backend
          docker build -t cabinet-proxy:scan -f frontend/Dockerfile .

      - name: Scan the backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cabinet-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only what an update would actually fix
          exit-code: "1"

      - name: Scan the proxy image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cabinet-proxy:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
