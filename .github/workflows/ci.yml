name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject and the version the container runs.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        # Tests use in-memory SQLite and mock every outbound call.
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # setup-node's npm cache requires a real lock file, not package.json.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  stack:
    name: Compose stack (build + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a throwaway .env
        # Written from scratch rather than copied from .env.example, so there
        # is exactly one definition of each variable. SETUP_CODE is also
        # exported to GITHUB_ENV, so the host-side steps below (which sign
        # in and claim through the proxy, not through docker compose) see
        # the same value the backend container was started with.
        run: |
          SETUP_CODE=5f8a2c9e1b7d4063a9e2f5c8b1d7e4a0
          {
            echo "DB_USER=cabinet"
            echo "DB_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DB_NAME=cabinet"
            echo "SECRET_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            # The runner reaches the stack as http://localhost (curl and Playwright).
            echo "PUBLIC_ORIGINS=http://localhost"
            echo "ALLOWED_HOSTS=localhost"
            echo "AUTH_INSECURE_HTTP=true"
            echo "SETUP_CODE=$SETUP_CODE"
          } > .env
          echo "SETUP_CODE=$SETUP_CODE" >> "$GITHUB_ENV"

      - name: Build and start
        run: docker compose up --build -d

      - name: Bootstrap sign-in and tokens
        # Waits for health, claims the stack with the setup code above, and
        # mints the write/read/metrics tokens the later steps use.
        run: scripts/ci/stack-smoke.sh bootstrap

      - name: Smoke-test the API through the proxy
        run: scripts/ci/stack-smoke.sh smoke

      - name: Rehearse an in-app backup and restore
        run: scripts/ci/stack-smoke.sh backup-restore

      - name: Rehearse a restore from inside the app
        run: scripts/ci/stack-smoke.sh restore-drill

      - name: Photos only for the signed-in (nginx auth_request)
        run: scripts/ci/stack-smoke.sh photos

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Drive the UI in a browser (Playwright)
        # The smoke tests above prove the API; this proves the pages. Runs
        # against the same stack, at http://localhost through the proxy.
        # SETUP_CODE is already in the job's env (from the .env step above);
        # named here too so global-setup.ts's needs are explicit.
        working-directory: frontend
        env:
          BASE_URL: http://localhost
          SETUP_CODE: ${{ env.SETUP_CODE }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend, stack]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Strip the leading "v" for the image tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-backend:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-proxy:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-proxy:latest
