name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject and the version the container runs.
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        # Tests use in-memory SQLite and mock every outbound call.
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          # setup-node's npm cache requires a real lock file, not package.json.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  stack:
    name: Compose stack (build + migrate + health)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway .env
        # Written from scratch rather than copied from .env.example, so there
        # is exactly one definition of each variable. SETUP_CODE is also
        # exported to GITHUB_ENV, so the host-side steps below (which sign
        # in and claim through the proxy, not through docker compose) see
        # the same value the backend container was started with.
        run: |
          SETUP_CODE=5f8a2c9e1b7d4063a9e2f5c8b1d7e4a0
          {
            echo "DB_USER=cabinet"
            echo "DB_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DB_NAME=cabinet"
            echo "SECRET_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            # The runner reaches the stack as http://localhost (curl and Playwright).
            echo "PUBLIC_ORIGINS=http://localhost"
            echo "ALLOWED_HOSTS=localhost"
            echo "AUTH_INSECURE_HTTP=true"
            echo "SETUP_CODE=$SETUP_CODE"
          } > .env
          echo "SETUP_CODE=$SETUP_CODE" >> "$GITHUB_ENV"
          # Every docker compose call in this job (up, exec, logs, the
          # teardown) sees the stack plus the CI-only mock provider
          # (docker-compose.ci.yml), with no -f. The mock answers the runner
          # at localhost:8555 and the backend at its service name.
          {
            echo "COMPOSE_FILE=docker-compose.yaml:docker-compose.ci.yml"
            echo "MOCK_IDP_URL=http://localhost:8555"
            echo "MOCK_IDP_ISSUER=http://mock_idp:8555"
          } >> "$GITHUB_ENV"

      - name: Build and start (with the mock provider)
        run: docker compose up --build -d

      - name: Two concurrent setup calls leave exactly one winner
        # Only meaningful before anything has claimed the stack, so this runs
        # first; scripts/ci/stack-smoke.sh's bootstrap step (next) claims it
        # for real, as the same CABINET_USER either race call could have won.
        run: scripts/ci/stack-smoke.sh race

      - name: Bootstrap sign-in and tokens
        # Waits for health, claims the stack with the setup code above, and
        # mints the write/read/metrics tokens the later steps use.
        run: scripts/ci/stack-smoke.sh bootstrap

      - name: Smoke-test the API through the proxy
        run: scripts/ci/stack-smoke.sh smoke

      - name: Outside-in checks (permissions, tokens, spoofed headers)
        run: scripts/ci/stack-smoke.sh outside-in

      - name: Rehearse an in-app backup and restore
        run: scripts/ci/stack-smoke.sh backup-restore

      - name: Rehearse a restore from inside the app
        run: scripts/ci/stack-smoke.sh restore-drill

      - name: Photos only for the signed-in (nginx auth_request)
        run: scripts/ci/stack-smoke.sh photos

      - name: Share links (public, no sign-in)
        run: scripts/ci/stack-smoke.sh share

      - name: Trusted header off (nginx include, redaction)
        run: scripts/ci/stack-smoke.sh trusted

      - name: Single sign-on through the mock provider (then the trusted header on)
        # Last of the smoke phases: it leaves the providers, a linked
        # identity, and the trusted-header mode ON (it recreates the backend
        # and proxy with TRUSTED_ASSERTION_*), which e2e/sso.spec.ts uses.
        run: scripts/ci/stack-smoke.sh sso

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Drive the UI in a browser (Playwright)
        # The smoke tests above prove the API; this proves the pages. Runs
        # against the same stack, at http://localhost through the proxy.
        # SETUP_CODE is already in the job's env (from the .env step above);
        # named here too so global-setup.ts's needs are explicit.
        working-directory: frontend
        env:
          BASE_URL: http://localhost
          SETUP_CODE: ${{ env.SETUP_CODE }}
          # e2e/sso.spec.ts mints assertions and signs in through the mock;
          # it sends the trusted header itself, so needs no TRUSTED_* value.
          MOCK_IDP_URL: http://localhost:8555
        # The whole step takes about two minutes. Without a limit, a stalled
        # download ran until someone canceled it (GitHub's default is six hours).
        timeout-minutes: 15
        run: |
          npm ci
          # `--with-deps` runs apt, which once hung for good on a runner whose
          # Ubuntu mirror stopped answering mid-fetch. Make apt give up on a
          # stalled connection and try again instead.
          echo 'Acquire::http::Timeout "30"; Acquire::https::Timeout "30"; Acquire::Retries "3";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  upgrade:
    name: Upgrade test (v0.29.1 -> this commit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway .env
        # docker-compose.yaml reads the database settings from .env (the
        # stack job writes its own the same way). The v0.30.0 settings come
        # from the script's own shell exports, so they are not repeated here.
        run: |
          {
            echo "DB_USER=cabinet"
            echo "DB_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DB_NAME=cabinet"
          } > .env

      - name: Run the upgrade test
        # Independent of the "stack" job's compose project: starts v0.29.1
        # (pulled from GHCR; the last release with no sign-in) against a
        # fresh database, adds an item anonymously, switches to the images
        # built from this commit, claims the upgraded stack, and checks both
        # migration chains reached head with the item still there. Exports
        # only into this step's shell, never a .env file (docs/specs/SPEC_0300.md
        # section 9).
        env:
          COMPOSE_PROJECT_NAME: cabinet-upgrade
          CABINET_PORT: "8082"
        run: scripts/ci/upgrade-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose -p cabinet-upgrade logs

      - name: Tear down
        if: always()
        run: docker compose -p cabinet-upgrade down -v

  arm64:
    name: Compose stack on arm64 (build + smoke)
    # A native arm64 runner: the images are built and started the way a
    # Raspberry Pi or an Apple Silicon host would, and the smoke script runs
    # through the proxy. What differs by architecture is what this covers:
    # every wheel in the lockfile, the pg_dump and pg_restore clients, age,
    # Pillow and the PDF library, and nginx. The amd64 "stack" job has the
    # mock identity provider and Playwright; this one doesn't repeat them.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a throwaway .env
        run: |
          SETUP_CODE=5f8a2c9e1b7d4063a9e2f5c8b1d7e4a0
          {
            echo "DB_USER=cabinet"
            echo "DB_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DB_NAME=cabinet"
            echo "SECRET_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "PUBLIC_ORIGINS=http://localhost"
            echo "ALLOWED_HOSTS=localhost"
            echo "AUTH_INSECURE_HTTP=true"
            echo "SETUP_CODE=$SETUP_CODE"
          } > .env
          echo "SETUP_CODE=$SETUP_CODE" >> "$GITHUB_ENV"

      - name: Build and start
        run: |
          docker compose up --build -d
          docker compose exec -T backend uname -m | grep -q aarch64

      - name: Smoke-test the stack through the proxy
        # Every phase in order; "sso" skips itself without the mock provider.
        run: scripts/ci/stack-smoke.sh all

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 60 # arm64 is built under emulation
    needs: [backend, frontend, stack, upgrade, arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # The tag is semver (v1.0.0-rc.1), pyproject is PEP 440 (1.0.0rc1);
      # both must name the same version, or /api/health and the image tag
      # disagree. Checked before anything is pushed. The same parse decides
      # whether this is a prerelease, however the tag is spelled.
      - name: Check the tag matches pyproject's version
        id: version
        run: |
          pip install --quiet packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          with open("backend/pyproject.toml", "rb") as f:
              declared = tomllib.load(f)["project"]["version"]
          if Version(tag) != Version(declared):
              raise SystemExit(f"tag v{tag} does not match pyproject version {declared}")
          print(f"tag v{tag} matches pyproject version {declared}")
          version = Version(tag)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"prerelease={str(version.is_prerelease).lower()}\n")
              out.write(f"major={version.major}\n")
              out.write(f"minor={version.minor}\n")
          PY

      # A prerelease (v1.0.0-rc.1, or v1.0.0rc1) is pushed under its own
      # version only; "latest" moves on stable releases. From 1.0.0 a stable
      # release also moves its major tag (1) and its minor tag (1.2), so a
      # deployment can follow fixes without following breaking changes.
      # Before 1.0 a minor release may break, so there is no 0 or 0.39 tag.
      # A version tag is never moved or deleted once pushed.
      - name: Image tags
        id: tags
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          MAJOR: ${{ steps.version.outputs.major }}
          MINOR: ${{ steps.version.outputs.minor }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for image in backend proxy; do
            name="ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-$image"
            {
              echo "$image<<EOF"
              echo "$name:$version"
              if [ "$PRERELEASE" = "false" ]; then
                echo "$name:latest"
                if [ "$MAJOR" -ge 1 ]; then
                  echo "$name:$MAJOR"
                  echo "$name:$MAJOR.$MINOR"
                fi
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both images for amd64 and arm64, labeled, with provenance and an SBOM
      # (.github/actions/build-images; images.yml runs the same build without
      # pushing when a pull request touches what an image is built from).
      - name: Build and push both images
        uses: ./.github/actions/build-images
        with:
          push: "true"
          version: ${{ steps.tags.outputs.version }}
          backend-tags: ${{ steps.tags.outputs.backend }}
          proxy-tags: ${{ steps.tags.outputs.proxy }}
