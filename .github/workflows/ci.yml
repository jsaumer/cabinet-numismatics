name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject and the version the container runs.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        working-directory: backend
        # Tests use in-memory SQLite and mock every outbound call.
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          # setup-node's npm cache requires a real lock file, not package.json.
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  stack:
    name: Compose stack (build + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a throwaway .env
        # Written from scratch rather than copied from .env.example, so there
        # is exactly one definition of each variable.
        run: |
          {
            echo "DB_USER=cabinet"
            echo "DB_PASSWORD=ci-$(openssl rand -hex 12)"
            echo "DB_NAME=cabinet"
            echo "SECRET_KEY=$(python3 -c 'import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
          } > .env

      - name: Build and start
        run: docker compose up --build -d

      - name: Wait for the backend to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost/api/health | grep -q '"db":"ok"'; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend never became healthy"; docker compose logs; exit 1

      - name: Confirm the schema migrated itself on startup
        run: |
          curl -fsS http://localhost/api/health | python3 -c '
          import json, sys
          schema = json.load(sys.stdin)["schema"]
          print(schema)
          assert schema["status"] == "ok", schema
          '

      - name: Smoke-test the API through the proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost/api/docs > /dev/null
          # create → read → trash → restore → delete for good, end to end
          id=$(curl -fsS -X POST http://localhost/api/items \
                 -H 'Content-Type: application/json' \
                 -d '{"type":"coin","country":"CI","denomination":"1 test","year":2026}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS "http://localhost/api/items/$id" > /dev/null
          curl -fsS -X DELETE "http://localhost/api/items/$id" -o /dev/null
          curl -fsS http://localhost/api/trash | grep -q "$id"
          curl -fsS -X POST "http://localhost/api/items/$id/restore" -o /dev/null
          curl -fsS -X DELETE "http://localhost/api/items/$id?permanent=true" -o /dev/null
          if curl -fsS "http://localhost/api/items/$id" -o /dev/null; then
            echo "the item survived a permanent delete"; exit 1
          fi
          curl -fsS http://localhost/api/settings > /dev/null
          curl -fsS http://localhost/api/dashboard/layout | python3 -c '
          import json, sys
          layout = json.load(sys.stdin)
          assert layout["is_default"] is True, layout
          assert len(layout["widgets"]) == 11, layout
          '
          # metrics: off by default, then served on real Postgres
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/metrics)" = 404
          curl -fsS -X PUT http://localhost/api/settings -H 'Content-Type: application/json' \
            -d '{"metrics_enabled": true}' -o /dev/null
          curl -fsS http://localhost/api/metrics > metrics.txt
          grep -q '^cabinet_schema_up_to_date 1.0' metrics.txt
          grep -q '^cabinet_items_in_trash 0.0' metrics.txt
          # no webhook saved: the test alert says so rather than failing
          curl -fsS -X POST http://localhost/api/alerts/test | grep -q '"ok":false'
          echo "smoke test passed"

      - name: Rehearse an in-app backup and restore
        run: |
          set -euo pipefail
          id=$(curl -fsS -X POST http://localhost/api/items \
                 -H 'Content-Type: application/json' \
                 -d '{"type":"coin","country":"Backup drill","denomination":"1 test","year":2026}' \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          # attach a PDF (made by Pillow inside the backend image) as a document
          docker compose exec -T backend python -c 'import io, sys; from PIL import Image; b = io.BytesIO(); Image.new("RGB", (200, 280), "white").save(b, "PDF"); sys.stdout.buffer.write(b.getvalue())' > receipt.pdf
          doc=$(curl -fsS -X POST "http://localhost/api/items/$id/documents" \
                  -F kind=receipt -F file=@receipt.pdf \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -o backup.zip http://localhost/api/backup.zip
          unzip -l backup.zip
          unzip -l backup.zip | grep -q documents.tar.gz
          curl -fsS -X DELETE "http://localhost/api/items/$id?permanent=true" -o /dev/null
          if curl -fsS "http://localhost/api/documents/$doc/file" -o /dev/null; then
            echo "the document outlived its only item"; exit 1
          fi
          ./scripts/restore.sh backup.zip
          curl -fsS "http://localhost/api/items/$id" > /dev/null
          curl -fsS "http://localhost/api/documents/$doc/file" -o restored.pdf
          cmp receipt.pdf restored.pdf
          echo "item $id and its document are back after restore"
          curl -fsS -X POST http://localhost/api/backups \
            | python3 -c 'import json,sys; run = json.load(sys.stdin); print(run); assert run["ok"]'

      - name: Rehearse a restore from inside the app
        run: |
          set -euo pipefail
          field() { python3 -c 'import json,sys; print(json.load(sys.stdin)[sys.argv[1]])' "$1"; }
          # the restore.sh drill above left its item behind: it has to survive
          drill_items() { curl -fsS 'http://localhost/api/items?country=Backup%20drill' | field total; }
          before=$(drill_items)
          test "$before" -ge 1
          keep=$(curl -fsS -X POST http://localhost/api/items                    -H 'Content-Type: application/json'                    -d '{"type":"coin","country":"Restore drill","denomination":"1 kept","year":2026}'                  | field id)
          name=$(curl -fsS -X POST http://localhost/api/backups | field file)
          marker=$(curl -fsS -X POST http://localhost/api/items                      -H 'Content-Type: application/json'                      -d '{"type":"coin","country":"Restore drill","denomination":"1 marker","year":2026}'                    | field id)
          rid=$(curl -fsS -X POST "http://localhost/api/restore/inspect?name=$name" | field restore_id)
          # a wrong phrase is refused, and nothing starts
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost/api/restore/$rid/run"                     -H 'Content-Type: application/json' -d '{"confirm":"yes"}')" = 422
          curl -fsS -X POST "http://localhost/api/restore/$rid/run"             -H 'Content-Type: application/json' -d '{"confirm":"RESTORE"}' -o /dev/null
          state=running
          for _ in $(seq 1 150); do   # five minutes
            state=$(curl -fsS http://localhost/api/restore/status | field state)
            [ "$state" = running ] || break
            sleep 2
          done
          curl -fsS http://localhost/api/restore/status
          test "$state" = done
          if curl -fsS "http://localhost/api/items/$marker" -o /dev/null; then
            echo "the marker item outlived the restore"; exit 1
          fi
          curl -fsS "http://localhost/api/items/$keep" > /dev/null
          test "$(drill_items)" = "$before"
          curl -fsS http://localhost/api/backups | grep -q -- '-prerestore.zip'
          curl -fsS http://localhost/api/health | grep -q '"db":"ok"'
          echo "in-app restore drill passed"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Drive the UI in a browser (Playwright)
        # The smoke tests above prove the API; this proves the pages. Runs
        # against the same stack, at http://localhost through the proxy.
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend, stack]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Strip the leading "v" for the image tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-backend:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-backend:latest

      - name: Build and push proxy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-proxy:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/cabinet-numismatics-proxy:latest
