# Cabinet as a Docker Swarm stack. Deploy from the repo root:
#
#   set -a; . ./.env; set +a           # stack deploy reads the shell, not .env
#   TAG=0.24.2 docker stack deploy -c deploy/docker-stack.yaml cabinet
#
# Differences from docker-compose.yaml, which stays the single-host path:
#   - images are pulled, never built (stack deploy ignores `build:`), so TAG
#     must name a published release (0.10.2 or later);
#   - no depends_on / restart: Swarm has neither; the backend waits for
#     Postgres itself, and restart_policy replaces restart;
#   - one replica each: the refresh, backup, and alert schedulers run inside
#     the backend process;
#   - storage is named volumes here so the file works as is; on a real Swarm
#     point every volume at shared storage (NFS binds, or a volume driver) so
#     a task can move between nodes. The backend refuses document uploads
#     unless /data/documents is a real mount, so don't leave that one out.
# See docs/deployment.md §7.

services:
  backend:
    image: ghcr.io/jsaumer/cabinet-numismatics-backend:${TAG:-latest}
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - PHOTO_DIR=/data/photos
      - SECRET_KEY_FILE=/data/state/secret.key
      - BACKUP_DIR=/data/backups
      - DOCUMENT_DIR=/data/documents
            - REESTIMATE_DAYS=${REESTIMATE_DAYS:-7}
      # The unprivileged user the backend drops to; match the owner of your
      # bind mounts or NFS paths.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - photo_data:/data/photos
      - backend_state:/data/state
      - backup_data:/data/backups
      - document_data:/data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Long enough for a first boot to wait out Postgres's initdb.
      start_period: 90s
    networks:
      - cabinet-internal
      # Outbound only: spot prices, exchange rates, price sources, and the
      # alert webhook. Attach whatever network in your Swarm has egress.
      - cabinet-egress
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s

  proxy:
    image: ghcr.io/jsaumer/cabinet-numismatics-proxy:${TAG:-latest}
    # Published on the routing mesh. Behind Traefik or another ingress, drop
    # `ports:` and add that proxy's labels here instead (see deployment.md
    # §3 for Traefik + Authentik forward-auth).
    ports:
      - "80:80"
    volumes:
      - photo_data:/usr/share/nginx/photos:ro
    networks:
      - cabinet-internal
      - cabinet-egress
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cabinet-internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1024M
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      restart_policy:
        condition: any
        delay: 10s

networks:
  # Backend ↔ db ↔ proxy only; nothing here is reachable from outside.
  cabinet-internal:
    driver: overlay
    internal: true
  # Replace with your Swarm's existing egress/ingress overlay (`external: true`)
  # if you have one; this default just gives the two services a way out.
  cabinet-egress:
    driver: overlay

volumes:
  db_data:
  photo_data:
  backend_state:
  backup_data:
  document_data:
