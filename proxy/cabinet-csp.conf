# The app's Content-Security-Policy (v0.32.0): shared by location / and the
# share view's @share_index, which can't inherit a sibling location's own
# add_header. Not included under /api/: documents carry their own, stricter
# policy. Images may come from anywhere over https (Numista thumbnails) and
# from blob:/data: (the photo editor); React sets inline style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
