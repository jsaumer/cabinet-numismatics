# Included in every location that proxies to the backend. nginx believes no
# forwarded header from anyone: each is overwritten with what nginx itself saw
# (its immediate peer and scheme), never appended to. An add_header or
# proxy_set_header in a location replaces the server-level ones, so every
# proxied location includes this whole file.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";

# Identity headers that forward-auth and SSO gateways add (Authentik,
# Authelia, oauth2-proxy, Pomerium, Cloudflare Access), blanked whoever sent
# them: Cabinet always asks for its own sign-in, and a client could send any
# of these itself. nginx can't wildcard a header name, so the list is
# explicit. An empty value means the header is not passed on.
proxy_set_header Remote-User "";
proxy_set_header Remote-Groups "";
proxy_set_header Remote-Email "";
proxy_set_header Remote-Name "";
proxy_set_header X-Forwarded-User "";
proxy_set_header X-Forwarded-Email "";
proxy_set_header X-Forwarded-Preferred-Username "";
proxy_set_header X-Forwarded-Groups "";
proxy_set_header X-authentik-username "";
proxy_set_header X-authentik-groups "";
proxy_set_header X-authentik-email "";
proxy_set_header X-authentik-name "";
proxy_set_header X-authentik-uid "";
proxy_set_header X-authentik-jwt "";
proxy_set_header X-authentik-meta-jwks "";
proxy_set_header X-authentik-meta-outpost "";
proxy_set_header X-authentik-meta-provider "";
proxy_set_header X-authentik-meta-app "";
proxy_set_header X-authentik-meta-version "";
proxy_set_header X-Auth-Request-User "";
proxy_set_header X-Auth-Request-Email "";
proxy_set_header X-Auth-Request-Preferred-Username "";
proxy_set_header X-Auth-Request-Groups "";
proxy_set_header X-Auth-Request-Access-Token "";
proxy_set_header X-Pomerium-Jwt-Assertion "";
proxy_set_header Cf-Access-Authenticated-User-Email "";
proxy_set_header Cf-Access-Jwt-Assertion "";
