# Included in every location that proxies to the backend. nginx believes no
# forwarded header from anyone: each is overwritten with what nginx itself saw
# (its immediate peer and scheme), never appended to. An add_header or
# proxy_set_header in a location replaces the server-level ones, so every
# proxied location includes this whole file.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Port "";
proxy_set_header X-Forwarded-Prefix "";
proxy_set_header Forwarded "";

# Identity headers that forward-auth and SSO gateways add (Authentik,
# Authelia, oauth2-proxy, Pomerium, Cloudflare Access, Google IAP): every one
# set to "" whoever sent it, except the single header TRUSTED_ASSERTION_HEADER
# names (the trusted-header mode, v0.33.0), which is passed on for the backend
# to verify. The list is generated at container start by
# 40-cabinet-config.sh, which is the only place that knows the variable (an
# nginx config can't read the environment); it is included here so every
# proxied location gets it with the rest of this file.
include /etc/nginx/cabinet/cabinet-identity.conf;
