# Security headers on every response. (HSTS belongs to whatever terminates
# TLS in front.) An add_header in a location replaces the server-level ones,
# so a location that sets its own includes this file again.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The webcam capture needs the camera; nothing needs the rest.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
