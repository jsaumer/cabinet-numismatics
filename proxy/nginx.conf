# Any Host that isn't Cabinet's gets no response at all (444 closes the
# connection): a request that names some other site, a bare IP address, or no
# Host is never served the app. The names that are answered come from
# PUBLIC_ORIGINS and ALLOWED_HOSTS (40-cabinet-hosts.sh, at start).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    include /etc/nginx/cabinet/hosts.conf;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 25M;   # allow photo uploads

    include /etc/nginx/cabinet/cabinet-headers.conf;

    # Photos are Cabinet's only files served straight from disk, so nginx asks
    # the backend before each one (a session, or a read or write token). Set
    # here, for the whole server, so a location added later is checked unless
    # it says otherwise; the app itself and the API turn it off (the API
    # checks every request itself).
    auth_request /_auth/photo;

    location = /_auth/photo {
        internal;
        auth_request off;
        proxy_pass http://backend:8000/api/auth/photo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # Every proxy_pass names no path, so the backend gets the request URI
    # exactly as the client sent it: a percent-encoded path reaches the gate,
    # which refuses it (400), rather than arriving decoded.

    # Anyone may reach sign-in and setup, so their bodies stay tiny: nginx
    # refuses more than 8 KiB (413), chunked bodies included.
    location = /api/auth/login {
        auth_request off;
        client_max_body_size 8k;
        proxy_pass http://backend:8000;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    location = /api/auth/setup {
        auth_request off;
        client_max_body_size 8k;
        proxy_pass http://backend:8000;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # Backups are built before the first byte is sent; a large photo volume
    # takes longer than nginx's default 60s wait.
    location /api/backup {
        auth_request off;
        proxy_pass http://backend:8000;
        proxy_read_timeout 30m;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # Imports: an OpenNumismat collection carries its photos, and importing
    # hundreds of items with photos takes longer than the default wait.
    location /api/imports {
        auth_request off;
        proxy_pass http://backend:8000;
        client_max_body_size 1024M;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # Restore: an uploaded archive carries every photo and document, the
    # backend writes it straight to the backup volume, and checking a large
    # one takes a while.
    location /api/restore {
        auth_request off;
        proxy_pass http://backend:8000;
        client_max_body_size 20g;
        proxy_request_buffering off;
        proxy_read_timeout 60m;
        proxy_send_timeout 60m;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # Buffered on purpose. When the backend refuses a request before its
    # body has arrived (the gate's 401 or 403), an unbuffered nginx keeps
    # sending the body to an upstream that has already answered and blocks
    # until proxy_send_timeout: measured, a refused 5 MB POST took 60 s
    # unbuffered and 14 ms buffered. Bodies here are at most 25 MB, so the
    # temporary file is the cheaper cost. The imports and restore locations
    # above stay unbuffered because their bodies are far too large to spool;
    # a refused large body there waits out their send timeout.
    location /api/ {
        auth_request off;
        proxy_pass http://backend:8000;
        include /etc/nginx/cabinet/cabinet-proxy.conf;
    }

    # A restore's working folders (.restore-new, .restore-old) sit inside the
    # photo volume for a moment; nothing hidden there is ever served.
    location ~ ^/photos/(.*/)?\. {
        return 404;
    }

    # A signed-in browser's photos, never cached anywhere: a shared or
    # back-button cache would outlive the sign-out. The check's own 401 or
    # 403 is passed through; any other failure (the backend down or
    # restarting) becomes nginx's 500, answered here as 503 with a retry.
    location /photos/ {
        alias /usr/share/nginx/photos/;
        error_page 500 = @photos_unavailable;
        add_header Cache-Control "private, no-store" always;
        include /etc/nginx/cabinet/cabinet-headers.conf;
    }

    location @photos_unavailable {
        auth_request off;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/cabinet/cabinet-headers.conf;
        return 503;
    }

    location / {
        auth_request off;
        try_files $uri $uri/ /index.html;   # SPA client-side routing
        # The app itself: its own scripts only, no plugins, no framing. Images
        # may come from anywhere over https (Numista thumbnails) and from
        # blob:/data: (the photo editor); React sets inline style attributes.
        # Not on /api/: documents carry their own, stricter policy. An
        # add_header here replaces the server-level ones, so they are included
        # again.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        include /etc/nginx/cabinet/cabinet-headers.conf;
    }
}
