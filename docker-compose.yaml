services:
  backend:
    build:
      context: ./backend
    # Published on release (see .github/workflows/ci.yml). `--build` always
    # rebuilds locally regardless of this tag; `docker stack deploy` (which
    # cannot build) pulls it. Pin a specific release with `TAG=0.10.1`.
    image: ghcr.io/jsaumer/cabinet-numismatics-backend:${TAG:-latest}
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - PHOTO_DIR=/data/photos
      - SECRET_KEY_FILE=/data/state/secret.key
    volumes:
      - photo_data:/data/photos
      # Private backend state (encryption key fallback). Deliberately NOT the
      # photo volume, which nginx serves publicly.
      - backend_state:/data/state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/jsaumer/cabinet-numismatics-proxy:${TAG:-latest}
    ports:
      - "80:80"
    volumes:
      - photo_data:/usr/share/nginx/photos:ro
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data:
  photo_data:
  backend_state:
