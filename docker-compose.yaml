# Every service keeps its log to three 10 MB files.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    build:
      context: ./backend
    # Published on release (see .github/workflows/ci.yml). `--build` always
    # rebuilds locally regardless of this tag; `docker stack deploy` (which
    # cannot build) pulls it. Pin a specific release with `TAG=0.10.1`.
    image: ghcr.io/jsaumer/cabinet-numismatics-backend:${TAG:-latest}
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - PHOTO_DIR=/data/photos
      - SECRET_KEY_FILE=/data/state/secret.key
      - BACKUP_DIR=/data/backups
      - DOCUMENT_DIR=/data/documents
      # Sign-in (v0.30.0); see .env.example. PUBLIC_ORIGINS is required.
      - PUBLIC_ORIGINS=${PUBLIC_ORIGINS:-}
      - AUTH_INSECURE_HTTP=${AUTH_INSECURE_HTTP:-false}
      - SETUP_CODE=${SETUP_CODE:-}
      - SETUP_CODE_FILE=${SETUP_CODE_FILE:-}
      # The backup key; unset, one is generated on the state volume.
      - BACKUP_KEY_FILE=${BACKUP_KEY_FILE:-}
      - BACKUP_KEY=${BACKUP_KEY:-}
    volumes:
      - photo_data:/data/photos
      # Private backend state (encryption key fallback). Deliberately NOT the
      # photo volume, which nginx serves publicly.
      - backend_state:/data/state
      # Scheduled and on-demand backups (Settings → Backups). Point this at a
      # NAS path to get archives off the host.
      - backup_data:/data/backups
      # Attached documents (receipts, certificates…). Private: served only
      # through the API, never by nginx. Uploads are refused if this isn't
      # mounted, so they can't end up inside the container.
      - document_data:/data/documents
      # Private working space (0700): an archive's database is unpacked here
      # to be checked and restored, never in the backup directory. Keep it on
      # this host's own disk.
      - staging_data:/data/staging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Password hashing (Argon2id, two at a time) needs 128 MB at most; this
    # matches the Swarm stack file.
    deploy:
      resources:
        limits:
          memory: 1024M
    logging: *logging
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/jsaumer/cabinet-numismatics-proxy:${TAG:-latest}
    ports:
      - "${CABINET_PORT:-80}:80"
    environment:
      # The Host names nginx answers: those of PUBLIC_ORIGINS, plus any
      # internal names in ALLOWED_HOSTS. Anything else gets no response.
      - PUBLIC_ORIGINS=${PUBLIC_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
    volumes:
      - photo_data:/usr/share/nginx/photos:ro
    depends_on:
      - backend
    logging: *logging
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    restart: unless-stopped

volumes:
  db_data:
  photo_data:
  backend_state:
  backup_data:
  document_data:
  staging_data:
